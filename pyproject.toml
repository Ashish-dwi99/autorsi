[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autorsi"
version = "0.1.0"
description = "Bounded, evaluation-gated model weight editing for Python applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "https://github.com/geniusgeek/autorsi"
Issues = "https://github.com/geniusgeek/autorsi/issues"

[project.optional-dependencies]
torch = ["torch>=2.2"]
hf-demo = ["torch>=2.2", "transformers>=4.40,<5"]

[project.scripts]
autorsi-demo = "autorsi.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autorsi", "autorsi.*"]
namespaces = false
